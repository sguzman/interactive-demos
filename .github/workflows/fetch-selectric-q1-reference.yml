name: Fetch Selectric Q1 reference

on:
  push:
    paths:
      - '.github/workflows/fetch-selectric-q1-reference.yml'

permissions:
  contents: read

jobs:
  fetch-q1:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original Wikimedia reference
        run: |
          set -euo pipefail
          mkdir -p reference
          curl --fail --location --retry 4 --retry-all-errors \
            'https://upload.wikimedia.org/wikipedia/commons/8/80/IBM_Selectric_I_%281%29.jpg' \
            --output reference/IBM_Selectric_Q1.jpg
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('reference/IBM_Selectric_Q1.jpg')
          data = p.read_bytes()
          print('bytes', len(data))
          print('sha256', hashlib.sha256(data).hexdigest())
          if len(data) < 1_000_000:
              raise SystemExit('reference download unexpectedly small')
          PY

      - name: Upload Q1 reference
        uses: actions/upload-artifact@v4
        with:
          name: selectric-q1-reference
          path: reference/IBM_Selectric_Q1.jpg
          if-no-files-found: error
          compression-level: 0
