name: game boy dmg deployed smoke

on:
  push:
    branches: [main]
    paths:
      - 'game-boy-dmg-01/**'
      - 'docs/game-boy-dmg-01.html'
      - 'demos.json'
      - 'engineering-projections.json'
      - '.github/workflows/game-boy-dmg-deployed-smoke.yml'
  workflow_dispatch:

concurrency:
  group: game-boy-dmg-deployed-main
  cancel-in-progress: true

jobs:
  live-dmg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/game-boy-dmg-01/
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium probe
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for Pages to expose the repaired runtime
        run: |
          node --input-type=module <<'EOF'
          const base = process.env.SITE_URL;
          const deadline = Date.now() + 180_000;
          let last = '';
          while (Date.now() < deadline) {
            try {
              const r = await fetch(base + 'main.js?probe=' + Date.now(), { cache:'no-store' });
              last = r.ok ? await r.text() : 'HTTP ' + r.status;
              if (r.ok && last.includes('referenceGeometryReady') && last.includes('upgradeReferenceGeometry') &&
                  last.includes('animateExplosion') && last.includes('audioFeedbackCount') &&
                  last.includes('floor.receiveShadow=false') && last.includes('REFERENCE_IDLE_MS') &&
                  last.includes('scheduleReferenceUpgrade')) {
                console.log('deployed runtime marker found');
                process.exit(0);
              }
            } catch (error) {
              last = String(error);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Pages did not expose the repaired DMG runtime within 180s. Last probe: ' + last.slice(0,200));
          EOF

      - name: Probe deployed DMG-01
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const url = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1365, height: 768 } });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          page.on('console', message => {
            if (message.type() === 'error') errors.push('console: ' + message.text());
          });

          const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });
          if (!response?.ok()) throw new Error('DMG page HTTP failure: ' + response?.status());

          // Hard startup gate: the deployed page must become interactive without waiting for remote CAD.
          await page.waitForFunction(() => Boolean(window.__dmgDebug?.state?.running), null, { timeout: 7_500 });

          const heading = await page.locator('h1').first().textContent();
          if (heading?.trim() !== 'Nintendo Game Boy DMG-01') {
            throw new Error('Unexpected public title: ' + JSON.stringify(heading));
          }

          const initial = await page.evaluate(() => window.__dmgDebug.state);
          if (initial.interaction?.floorReceivesShadow !== false) {
            throw new Error('Product floor still receives detached shadows');
          }

          // Exercise the actual native range drag for >0.8 s; synthetic input was insufficient for
          // the user's reported "stops after half a second" regression.
          const slider = page.locator('#explodeRange');
          const box = await slider.boundingBox();
          if (!box) throw new Error('Dissection slider has no layout box');
          await page.mouse.move(box.x + 4, box.y + box.height / 2);
          await page.mouse.down();
          for (let i = 1; i <= 8; i++) {
            await page.mouse.move(box.x + 4 + (box.width - 8) * (i / 8), box.y + box.height / 2);
            await page.waitForTimeout(110);
          }
          const dragging = await page.evaluate(() => window.__dmgDebug.state);
          if (!dragging.interaction?.sliderDragging || dragging.explosion < 0.80) {
            throw new Error('Sustained deployed slider drag failed: ' + JSON.stringify({
              sliderDragging: dragging.interaction?.sliderDragging,
              explosion: dragging.explosion
            }));
          }
          await page.mouse.up();

          // Explode button must animate through intermediate values rather than jump to the endpoint.
          await page.evaluate(() => window.__dmgDebug.setExplosion(0));
          await page.locator('#explodeBtn').click();
          await page.waitForTimeout(260);
          const midExplode = await page.evaluate(() => window.__dmgDebug.state);
          if (!midExplode.interaction?.explosionAnimating || midExplode.explosion <= 0.01 || midExplode.explosion >= 0.95) {
            throw new Error('Explode button did not animate gradually: ' + JSON.stringify({ explosion:midExplode.explosion, interaction:midExplode.interaction }));
          }
          await page.waitForFunction(() => window.__dmgDebug.state.explosion > 0.995 && !window.__dmgDebug.state.interaction.explosionAnimating);

          // Power off must be visible in the rendered LCD state, not only in a text status field.
          await page.locator('#powerBtn').click();
          const off = await page.evaluate(() => window.__dmgDebug.state);
          if (off.running !== false || off.geometry?.screenPowered !== false) {
            throw new Error('Power-off LCD did not blank: ' + JSON.stringify({ running:off.running, screenPowered:off.geometry?.screenPowered }));
          }
          await page.locator('#powerBtn').click();

          // All eight physical HUD controls must emit feedback, not only A.
          const audioBefore = (await page.evaluate(() => window.__dmgDebug.state)).interaction.audioFeedbackCount;
          for (const name of ['Up','Down','Left','Right','B','A','Select','Start']) {
            await page.locator('[data-button="' + name + '"]').dispatchEvent('pointerdown');
            await page.locator('[data-button="' + name + '"]').dispatchEvent('pointerup');
          }
          const audioAfter = await page.evaluate(() => window.__dmgDebug.state);
          if (audioAfter.interaction.audioFeedbackCount !== audioBefore + 8) {
            throw new Error('Not every physical HUD button emitted audio feedback');
          }

          // High-fidelity reference geometry remains an acceptance requirement, not merely a background bonus.
          await page.waitForFunction(() => window.__dmgDebug?.state?.referenceGeometryReady === true, null, { timeout: 90_000 });
          const reference = await page.evaluate(() => window.__dmgDebug.state);
          if (!String(reference.geometry?.revision || '').startsWith('dmg-reference-cad-')) {
            throw new Error('Reference geometry did not replace fallback: ' + JSON.stringify(reference.geometry?.revision));
          }
          if (reference.geometry?.screenPowered !== true) {
            throw new Error('Reference LCD did not restore after power-on');
          }

          await page.evaluate(() => window.__dmgDebug.setExplosion(0));
          await page.screenshot({ path: 'dmg-deployed.png', fullPage: true });

          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          await browser.close();
          console.log('deployed DMG startup + reference upgrade + sustained drag + animated explode + power LCD + audio feedback passed:', url);
          EOF

      - name: Upload deployed screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-boy-dmg-deployed-smoke
          path: dmg-deployed.png
          if-no-files-found: ignore
