name: ibm selectric 721 runtime smoke

concurrency:
  group: ibm-selectric-721-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/**'
      - 'tests/ibm-selectric-721-runtime.spec.mjs'
      - '.github/workflows/ibm-selectric-721-runtime-smoke.yml'
      - 'demos.json'
      - 'engineering-projections.json'
  pull_request:
    paths:
      - 'ibm-selectric-721/**'
      - 'tests/ibm-selectric-721-runtime.spec.mjs'
      - '.github/workflows/ibm-selectric-721-runtime-smoke.yml'
      - 'demos.json'
      - 'engineering-projections.json'

jobs:
  selectric-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-http.log 2>&1 &
          echo $! > /tmp/selectric-http.pid
      - name: Run Selectric 721 runtime smoke
        run: npx playwright test tests/ibm-selectric-721-runtime.spec.mjs --reporter=line
      - name: Upload runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibm-selectric-721-runtime-smoke
          path: test-results/
          if-no-files-found: ignore
