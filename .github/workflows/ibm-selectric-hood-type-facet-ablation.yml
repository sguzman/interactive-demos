name: IBM Selectric hood/type facet ablation

concurrency:
  group: selectric-hood-type-facet-ablation
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-hood-type-facet-ablation.spec.mjs'
      - '.github/workflows/ibm-selectric-hood-type-facet-ablation.yml'
  workflow_dispatch:

jobs:
  facet-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-facet-ablation.log 2>&1 &
      - name: Evaluate four model-only hood facet masks across 45 poses
        run: npx playwright test tests/ibm-selectric-721-hood-type-facet-ablation.spec.mjs --reporter=line --workers=1
      - name: Upload hood-facet ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-hood-type-facet-ablation
          path: test-results/selectric-hood-type-facet-ablation.json
          if-no-files-found: ignore
