name: IBM Selectric hood/type submesh broadphase

concurrency:
  group: selectric-hood-type-submesh
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-hood-type-submesh.spec.mjs'
      - '.github/workflows/ibm-selectric-hood-type-submesh.yml'
  workflow_dispatch:

jobs:
  submesh-broadphase:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-submesh-http.log 2>&1 &
      - name: Validate 90 source-unpromoted hood/type submesh AABB samples
        run: npx playwright test tests/ibm-selectric-721-hood-type-submesh.spec.mjs --reporter=line --workers=1
      - name: Upload type submesh broadphase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-hood-type-submesh-broadphase
          path: test-results/selectric-hood-type-submesh-broadphase.json
          if-no-files-found: ignore
