name: IBM Selectric instance-aware hood/type SAT

concurrency:
  group: selectric-hood-type-triangle-sat
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-hood-type-triangle-sat.spec.mjs'
      - '.github/workflows/ibm-selectric-hood-type-triangle-sat.yml'
  workflow_dispatch:

jobs:
  triangle-sat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-hood-sat-http.log 2>&1 &
      - name: Validate 90 type-element instanced-triangle / hood box SAT poses
        run: npx playwright test tests/ibm-selectric-721-hood-type-triangle-sat.spec.mjs --reporter=line --workers=1
      - name: Upload modeled hood/type SAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-hood-type-triangle-sat
          path: test-results/selectric-hood-type-triangle-sat.json
          if-no-files-found: ignore
