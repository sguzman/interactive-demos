name: IBM Selectric hood-type triangle sweep

concurrency:
  group: selectric-hood-type-triangle-sweep
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-hood-type-triangle-sweep.spec.mjs'
      - '.github/workflows/ibm-selectric-hood-type-triangle-sweep.yml'
  workflow_dispatch:

jobs:
  triangle-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-hood-type-3d.log 2>&1 &
      - name: Run conservatively classified 90-state triangle/sphere sweep
        run: npx playwright test tests/ibm-selectric-721-hood-type-triangle-sweep.spec.mjs --reporter=line --workers=1
      - name: Upload hood/type triangle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-hood-type-triangle-sweep
          path: test-results/selectric-hood-type-triangle-sweep.json
          if-no-files-found: ignore
