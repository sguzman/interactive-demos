name: Experimental Selectric P4 knob candidate Chromium QA

# Opt-in engineering-branch smoke. Never runs for public default/main.
on:
  push:
    branches:
      - engineering/selectric-knob-candidate-20261018
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-platen-knob-candidate.spec.mjs'
      - '.github/workflows/ibm-selectric-platen-knob-candidate.yml'

permissions:
  contents: read

concurrency:
  group: experimental-selectric-knob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current experimental JS syntax
        run: |
          node --check ibm-selectric-721/geometry.js
          node --check ibm-selectric-721/main.js
          node --check ibm-selectric-721/spec.js
          node --check tests/ibm-selectric-721-platen-knob-candidate.spec.mjs
      - name: Install headless Chromium/Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve experimental viewer locally
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-knob-candidate.log 2>&1 &
      - name: Run opt-in reversible candidate geometry QA
        run: npx playwright test tests/ibm-selectric-721-platen-knob-candidate.spec.mjs --reporter=line --workers=1
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-selectric-knob-browser-qa
          path: test-results/
          if-no-files-found: ignore
