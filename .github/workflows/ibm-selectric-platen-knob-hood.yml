name: IBM Selectric outboard platen-knob hood broadphase

concurrency:
  group: selectric-knob-hood-broadphase
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'ibm-selectric-721/spec.js'
      - 'tests/ibm-selectric-721-platen-knob-hood.spec.mjs'
      - '.github/workflows/ibm-selectric-platen-knob-hood.yml'
  workflow_dispatch:

jobs:
  knob-cover-aabb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve demo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/selectric-knob-hood.log 2>&1 &
      - name: Sample platen knob against actual hood and bridge AABBs
        run: npx playwright test tests/ibm-selectric-721-platen-knob-hood.spec.mjs --reporter=line --workers=1
      - name: Upload nonpromoting broadphase candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-platen-knob-cover-broadphase
          path: test-results/selectric-platen-knob-cover-broadphase.json
          if-no-files-found: ignore
