name: IBM Selectric knob-bridge contact release

concurrency:
  group: selectric-knob-bridge-release
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'ibm-selectric-721/geometry.js'
      - 'ibm-selectric-721/main.js'
      - 'tests/ibm-selectric-721-platen-knob-transition.spec.mjs'
      - '.github/workflows/ibm-selectric-platen-knob-transition.yml'
  workflow_dispatch:

jobs:
  knob-bridge-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/selectric-knob-release.log 2>&1 &
      - name: Measure modeled rear-bridge contact phase releases
        run: npx playwright test tests/ibm-selectric-721-platen-knob-transition.spec.mjs --reporter=line --workers=1
      - name: Upload contact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selectric-platen-knob-contact-transition
          path: test-results/selectric-platen-knob-transition.json
          if-no-files-found: ignore
