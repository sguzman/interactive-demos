name: sx70 runtime smoke

concurrency:
  group: sx70-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'sx70/**'
      - 'tests/sx70-runtime.spec.mjs'
      - '.github/workflows/sx70-runtime-smoke.yml'
  pull_request:
    paths:
      - 'sx70/**'
      - 'tests/sx70-runtime.spec.mjs'
      - '.github/workflows/sx70-runtime-smoke.yml'

jobs:
  sx70-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sx70-http.log 2>&1 &
          echo $! > /tmp/sx70-http.pid
      - name: Run SX-70 folding shell in Chromium
        run: npx playwright test tests/sx70-runtime.spec.mjs --reporter=line
      - name: Upload runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sx70-runtime-smoke
          path: test-results/
          if-no-files-found: ignore
