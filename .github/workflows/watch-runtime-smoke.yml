name: watch runtime smoke

on:
  push:
    branches: [main]
    paths:
      - 'watch/**'
      - 'tests/watch-runtime.spec.mjs'
      - '.github/workflows/watch-runtime-smoke.yml'
  pull_request:
    paths:
      - 'watch/**'
      - 'tests/watch-runtime.spec.mjs'
      - '.github/workflows/watch-runtime-smoke.yml'

jobs:
  watch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/watch-http.log 2>&1 &
          echo $! > /tmp/watch-http.pid
      - name: Run watch simulation in Chromium
        run: npx playwright test tests/watch-runtime.spec.mjs --reporter=line
      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-runtime-smoke
          path: test-results/
          if-no-files-found: ignore
